name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m pytest -q
      - name: Verify tag matches project version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $projectVersion = (Get-Content VERSION -Raw).Trim()
          if ($tagVersion -ne $projectVersion) {
            throw "Tag version $tagVersion does not match VERSION file $projectVersion."
          }
      - name: Build native plugin
        shell: pwsh
        run: ./plugin/online-source/build-and-install.ps1 -BuildOnly
      - name: Build sanitized release archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./scripts/build-release.ps1 -Version $version
      - name: Verify packaged application
        run: uv run python scripts/verify-release.py
      - name: Publish GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "${{ github.ref_name }}"
          gh release view $tag --json id --jq .id 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/*.zip dist/*.sha256 --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release asset replacement failed." }
            gh release edit $tag --title "VDJ Companion $version" --notes-file "docs/releases/$version.md"
          } else {
            gh release create $tag dist/*.zip dist/*.sha256 --verify-tag --title "VDJ Companion $version" --notes-file "docs/releases/$version.md"
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed." }
